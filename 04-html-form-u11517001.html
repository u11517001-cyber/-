<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放學後社團體驗表</title>
    <style>
        :root {
            --primary-color: #ff7043;
            --primary-light: #ffccbc;
            --secondary-color: #42a5f5;
            --accent-color: #66bb6a;
            --bg-color: #fff9c4;
            --card-bg: #ffffff;
            --text-color: #37474f;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
        }

        body {
            background-color: #f0f4f8;
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 3px solid #ffe082;
        }

        header {
            background: linear-gradient(135deg, #ffb74d, #ffa726);
            color: white;
            padding: 25px 20px;
            text-align: center;
            position: relative;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 1.8em;
            letter-spacing: 1px;
        }

        .notice-banner {
            background-color: #fff3e0;
            border: 2px dashed #ff9800;
            color: #e65100;
            padding: 10px 15px;
            border-radius: var(--border-radius);
            font-size: 0.9em;
            margin: 15px 20px 0 20px;
            text-align: center;
            font-weight: bold;
        }

        form {
            padding: 20px;
        }

        .form-group {
            background-color: #fafafa;
            border: 2px solid #eceff1;
            padding: 18px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }

        .form-group:focus-within {
            border-color: var(--secondary-color);
        }

        label.section-label {
            display: block;
            font-size: 1.1em;
            font-weight: bold;
            color: #263238;
            margin-bottom: 10px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #cfd8dc;
            border-radius: 8px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--primary-color);
        }

        .hint {
            font-size: 0.85em;
            color: #78909c;
            margin-top: 5px;
        }

        /* 選項外觀調整 (Radio & Checkbox) */
        .options-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .option-item {
            position: relative;
        }

        .option-item input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .option-item label {
            display: inline-block;
            padding: 8px 16px;
            background-color: #ffffff;
            border: 2px solid #b0bec5;
            border-radius: 20px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease-in-out;
            font-weight: 500;
        }

        .option-item input:checked + label {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            color: #d84315;
            font-weight: bold;
        }

        .option-item input:focus + label {
            box-shadow: 0 0 0 3px rgba(255, 112, 67, 0.3);
        }

        .status-badge {
            display: inline-block;
            background-color: #e0e0e0;
            color: #616161;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #81c784;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-submit:hover {
            background-color: #66bb6a;
        }

        /* 預覽卡片區塊 */
        .preview-card {
            background-color: #e8f5e9;
            border: 2px dashed #81c784;
            padding: 15px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
        }

        .preview-card h3 {
            margin-top: 0;
            color: #2e7d32;
            font-size: 1em;
        }

        .preview-item {
            margin-bottom: 5px;
            font-size: 0.95em;
        }

        .preview-value {
            font-weight: bold;
            color: #1b5e20;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎨 放學後社團體驗表</h1>
    </header>

    <div class="notice-banner">
        ⚠️ 這是介面練習，資料不會送出或保存，不能當成正式報名。
    </div>

    <form id="experienceForm" onsubmit="handleSubmit(event)">
        
        <!-- 我的暱稱 -->
        <div class="form-group">
            <label class="section-label" for="nickname">我的暱稱</label>
            <input type="text" id="nickname" name="nickname" placeholder="例如小星星" oninput="updatePreview()">
            <div class="hint">提示：例如小星星</div>
        </div>

        <!-- 想體驗的社團 -->
        <div class="form-group">
            <label class="section-label">想體驗的社團</label>
            <div class="options-group">
                <div class="option-item">
                    <input type="radio" id="club1" name="club" value="故事劇場" onchange="updatePreview()">
                    <label for="club1">🎭 故事劇場</label>
                </div>
                <div class="option-item">
                    <input type="radio" id="club2" name="club" value="科學手作" onchange="updatePreview()">
                    <label for="club2">🔬 科學手作</label>
                </div>
                <div class="option-item">
                    <input type="radio" id="club3" name="club" value="桌遊挑戰" onchange="updatePreview()">
                    <label for="club3">🎲 桌遊挑戰</label>
                </div>
            </div>
        </div>

        <!-- 方便參加的日子 -->
        <div class="form-group">
            <label class="section-label">方便參加的日子（可複選）</label>
            <div class="options-group">
                <div class="option-item">
                    <input type="checkbox" id="day1" name="days" value="星期二" onchange="updatePreview()">
                    <label for="day1">星期二</label>
                </div>
                <div class="option-item">
                    <input type="checkbox" id="day2" name="days" value="星期四" onchange="updatePreview()">
                    <label for="day2">星期四</label>
                </div>
                <div class="option-item">
                    <input type="checkbox" id="day3" name="days" value="星期五" onchange="updatePreview()">
                    <label for="day3">星期五</label>
                </div>
            </div>
        </div>

        <!-- 我期待的活動方式 -->
        <div class="form-group">
            <label class="section-label">我期待的活動方式（可複選）</label>
            <div class="options-group">
                <div class="option-item">
                    <input type="checkbox" id="style1" name="styles" value="動手製作" onchange="updatePreview()">
                    <label for="style1">✂️ 動手製作</label>
                </div>
                <div class="option-item">
                    <input type="checkbox" id="style2" name="styles" value="和同學合作" onchange="updatePreview()">
                    <label for="style2">🤝 和同學合作</label>
                </div>
                <div class="option-item">
                    <input type="checkbox" id="style3" name="styles" value="上台分享" onchange="updatePreview()">
                    <label for="style3">🎤 上台分享</label>
                </div>
            </div>
        </div>

        <!-- 想告訴老師的事 -->
        <div class="form-group">
            <label class="section-label" for="message">想告訴老師的事</label>
            <textarea id="message" name="message" rows="3" placeholder="例如我想和同學一起完成一個小作品" oninput="updatePreview()"></textarea>
            <div class="hint">提示：例如我想和同學一起完成一個小作品</div>
        </div>

        <!-- 即時填寫預覽區 -->
        <div class="preview-card">
            <h3>👀 即時填寫預覽：</h3>
            <div class="preview-item">暱稱：<span id="prev-nickname" class="preview-value">尚未填寫</span></div>
            <div class="preview-item">社團：<span id="prev-club" class="preview-value">尚未選擇</span></div>
            <div class="preview-item">日子：<span id="prev-days" class="preview-value">尚未選擇</span></div>
            <div class="preview-item">方式：<span id="prev-styles" class="preview-value">尚未選擇</span></div>
            <div class="preview-item">留言：<span id="prev-message" class="preview-value">尚未填寫</span></div>
        </div>

        <!-- 狀態與按鈕 -->
        <div style="text-align: center; margin-bottom: 15px;">
            <button type="submit" class="btn-submit">送出練習測試</button>
            <div class="status-badge">🔒 練習版，尚未開放報名</div>
        </div>

    </form>
</div>

<script>
    function updatePreview() {
        // 暱稱
        const nickname = document.getElementById('nickname').value.trim();
        document.getElementById('prev-nickname').innerText = nickname || '尚未填寫';

        // 社團 (Radio)
        const selectedClub = document.querySelector('input[name="club"]:checked');
        document.getElementById('prev-club').innerText = selectedClub ? selectedClub.value : '尚未選擇';

        // 日子 (Checkbox)
        const selectedDays = Array.from(document.querySelectorAll('input[name="days"]:checked')).map(el => el.value);
        document.getElementById('prev-days').innerText = selectedDays.length > 0 ? selectedDays.join('、') : '尚未選擇';

        // 方式 (Checkbox)
        const selectedStyles = Array.from(document.querySelectorAll('input[name="styles"]:checked')).map(el => el.value);
        document.getElementById('prev-styles').innerText = selectedStyles.length > 0 ? selectedStyles.join('、') : '尚未選擇';

        // 留言
        const message = document.getElementById('message').value.trim();
        document.getElementById('prev-message').innerText = message || '尚未填寫';
    }

    function handleSubmit(event) {
        event.preventDefault();
        alert("【練習完成】\n感謝體驗！此為介面練習頁面，您的資料不會被傳送或保存。");
    }
</script>

</body>
</html>
